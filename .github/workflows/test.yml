name: Tests CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: qa

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemetria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemetria_test
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_CPU_TEMP: ${{ vars.ALERT_CPU_TEMP || '75' }}
      ALERT_GPU_TEMP: ${{ vars.ALERT_GPU_TEMP || '80' }}
      ALERT_RAM_PCT: ${{ vars.ALERT_RAM_PCT || '90' }}
      ALERT_VRAM_PCT: ${{ vars.ALERT_VRAM_PCT || '90' }}
      CHECK_INTERVAL_MIN: ${{ vars.CHECK_INTERVAL_MIN || '5' }}
      HOSTNAME: ci-test
      GPU_BACKEND: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Initialize database schema
        run: python -c "from database.repository import init_db; init_db()"

      - name: Run tests
        run: pytest -v
